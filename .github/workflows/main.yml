name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip mod source
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in repo root!"
            exit 1
          fi
          echo "Unzipping $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        id: locate
        run: |
          BUILD_DIR=$(dirname "$(find extracted -maxdepth 5 -name 'settings.gradle' | head -n 1)")
          if [ -z "$BUILD_DIR" ] || [ "$BUILD_DIR" = "." ]; then
            echo "Could not find settings.gradle inside the zip!"
            exit 1
          fi
          echo "Found Gradle project at: $BUILD_DIR"
          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build with Gradle
        working-directory: ${{ steps.locate.outputs.build_dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: RealisticTreePhysics-jar
          path: ${{ steps.locate.outputs.build_dir }}/build/libs/*.jar
